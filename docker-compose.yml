version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: style_db1
    environment:
      POSTGRES_DB: stylecommunicator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: style_backend1
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/stylecommunicator
      DB_USER: postgres
      DB_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: dev
      PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data: