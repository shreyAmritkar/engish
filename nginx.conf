##############################################################################
# Nginx reverse-proxy config for style-communicator backend
# Place at: /etc/nginx/sites-available/style-communicator
# Enable:   sudo ln -s /etc/nginx/sites-available/style-communicator \
#                      /etc/nginx/sites-enabled/
##############################################################################

# Rate-limiting zone (shared memory, 10 MB, max 20 req/s per IP)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

upstream spring_boot {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;          # ← change this

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yourdomain.com;          # ← change this

    # TLS (managed by Certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-XSS-Protection          "1; mode=block" always;

    # Gzip
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    # Proxy to Spring Boot
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass         http://spring_boot/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffer tuning
        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;
    }

    # Health-check endpoint (no rate limit)
    location /api/health {
        proxy_pass http://spring_boot/health;
        access_log off;
    }

    # Block everything else
    location / {
        return 404;
    }
}