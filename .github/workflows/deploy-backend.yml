##############################################################################
# .github/workflows/deploy-backend.yml
#
# Trigger: push to main (backend/** changes) OR manual dispatch
#
# What it does:
#   1. Runs tests (mvn verify)
#   2. Builds & pushes Docker image to GitHub Container Registry (ghcr.io)
#   3. SSH-deploys to your VPS: pulls the new image & restarts the container
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   DEPLOY_HOST        – VPS IP or hostname  e.g. 123.45.67.89
#   DEPLOY_USER        – SSH user             e.g. ubuntu
#   DEPLOY_SSH_KEY     – Private key (RSA/ED25519) — paste the full key
#   DEPLOY_ENV         – Full contents of backend/.env for production
##############################################################################

name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:        # allow manual trigger from GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/style-communicator-backend

jobs:
  # ── 1. Test ──────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stylecommunicator_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/stylecommunicator_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          PORT: 8080
          LLM_PROVIDER: openrouter
          OPENROUTER_API_KEY: dummy-for-tests
        run: mvn -B verify

  # ── 2. Build & Push Docker image ─────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy to VPS ─────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production        # optional: add required reviewers in GitHub

    steps:
      - name: Write production .env to runner
        run: echo "${{ secrets.DEPLOY_ENV }}" > /tmp/backend.env

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: REGISTRY,IMAGE_NAME
          script: |
            set -e

            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

            # Pull latest image (login not needed for public ghcr; add if private)
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull "$IMAGE"

            # Graceful stop of old container (ignore if not running)
            docker stop style_backend 2>/dev/null || true
            docker rm   style_backend 2>/dev/null || true

            # Ensure network exists
            docker network create style_net 2>/dev/null || true

            # Run new container
            docker run -d \
              --name style_backend \
              --network style_net \
              --restart unless-stopped \
              --env-file /opt/style-communicator/.env \
              -p 127.0.0.1:8080:8080 \
              "$IMAGE"

            # Wait for health check
            echo "Waiting for app to be healthy..."
            for i in $(seq 1 30); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health || true)
              if [ "$STATUS" = "200" ]; then
                echo "✅ Healthy after ${i}s"
                break
              fi
              sleep 2
            done

            if [ "$STATUS" != "200" ]; then
              echo "❌ Health check failed — rolling back"
              docker stop style_backend || true
              exit 1
            fi

            # Clean up dangling images
            docker image prune -f

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment failed. Check the logs above."
          # Add Slack/email/webhook notification here if desired