name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stylecommunicator_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/stylecommunicator_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          PORT: 10000
          LLM_PROVIDER: openrouter
          OPENROUTER_API_KEY: dummy-for-tests
        run: mvn -B verify

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (verify Dockerfile works)
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: false        # Render pulls from GitHub directly, no push needed

  trigger-render:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"   