spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: style-communicator
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT}

# One key: OPENROUTER_API_KEY — pick any model id (Gemini, DeepSeek, etc.) via LLM_FAST_MODEL / LLM_QUALITY_MODEL
llm:
  provider: ${LLM_PROVIDER:openrouter}
  api-key: ${OPENROUTER_API_KEY:${LLM_API_KEY:${GEMINI_API_KEY:}}}
  fast-model: ${LLM_FAST_MODEL:google/gemini-2.0-flash-001}
  quality-model: ${LLM_QUALITY_MODEL:google/gemini-2.0-flash-001}
  fallback-models:
    - google/gemini-2.0-flash-001
    - openai/gpt-4o-mini
  retry-max-attempts: ${LLM_RETRY_MAX:3}
  retry-backoff-ms: ${LLM_RETRY_BACKOFF_MS:2000}
  openrouter:
    base-url: https://openrouter.ai/api/v1
    site-url: ${OPENROUTER_SITE_URL:http://localhost:3000}
    app-name: ${OPENROUTER_APP_NAME:Style Communicator}

app:
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
  daily-session-cap: 10
  style-cache-ttl-minutes: 60
  similarity-threshold: 0.85
