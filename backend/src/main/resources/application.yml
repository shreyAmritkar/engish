spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: style-communicator
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  output:
    ansi:
      enabled: ${ANSI_ENABLED:DETECT}   # ALWAYS locally, NEVER on Render

server:
  port: ${PORT:10000}

logging:
  level:
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}   # DEBUG locally, INFO on Render

llm:
  api-key: ${OPENROUTER_API_KEY:${LLM_API_KEY:}}
  fast-model: ${LLM_FAST_MODEL:google/gemini-2.0-flash-001}
  quality-model: ${LLM_QUALITY_MODEL:google/gemini-2.0-flash-001}
  fallback-models:
    - google/gemini-2.0-flash-001
    - openai/gpt-4o-mini
  retry-max-attempts: ${LLM_RETRY_MAX:3}
  retry-backoff-ms: ${LLM_RETRY_BACKOFF_MS:2000}
  openrouter:
    base-url: https://openrouter.ai/api/v1
    site-url: ${OPENROUTER_SITE_URL:http://localhost:3000}
    app-name: ${OPENROUTER_APP_NAME:Style Communicator}

app:
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
  daily-session-cap: 10
  style-cache-ttl-minutes: 60
  similarity-threshold: 0.85
  jwt-secret: ${JWT_SECRET:change-me-in-production-min-32-chars!!}
  jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# CORRECTED METRICS BLOCK FOR MICROMETER OTLP EXPORTER
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,otlp
  otlp:
    metrics:
      export:
        url: ${OTLP_METRICS_ENDPOINT}
        headers:
          Authorization: ${OTLP_METRICS_AUTH_HEADER}
        step: 60s
        resource-attributes:
          service.name: style-communicator
          deployment.environment: production