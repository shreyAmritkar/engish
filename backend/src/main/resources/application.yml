spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: style-communicator
  
  # ============ DataSource & Connection Pooling ============
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
      pool-name: HikariPool-StyleCommunicator
      connection-test-query: SELECT 1
  
  # ============ JPA & Hibernate ============
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 20
          fetch_size: 50
        format_sql: false
        use_sql_comments: true
        order_inserts: true
        order_updates: true
    show-sql: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  # ============ Jackson JSON Configuration ============
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
  
  # ============ Validation ============
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

# ============ Server Configuration ============
server:
  port: ${PORT:10000}
  tomcat:
    threads:
      max: 200
      min-spare: 10
    max-connections: 10000
    accept-count: 100
  error:
    include-message: always
    include-binding-errors: always

# ============ Logging ============
logging:
  level:
    root: INFO
    com.stylecommunicator: DEBUG
    org.springframework: WARN
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 30
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ============ Actuator & Monitoring ============
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      enabled: true
    info:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# One key: OPENROUTER_API_KEY — pick any model id (Gemini, DeepSeek, etc.) via LLM_FAST_MODEL / LLM_QUALITY_MODEL
llm:
  api-key: ${OPENROUTER_API_KEY:${LLM_API_KEY:}}
  # Primary model
  fast-model: ${LLM_FAST_MODEL:google/gemma-4-26b-a4b-it:free}

  # Higher-quality model
  quality-model: ${LLM_QUALITY_MODEL:google/gemma-4-31b-it:free}

  # Used when the primary/quality model fails
  fallback-models:
    - google/gemma-4-31b-it:free
    - minimax/minimax-m3:free
    - nvidia/nemotron-3-super:free
    - zai/glm-5.2:free

  retry-max-attempts: ${LLM_RETRY_MAX:3}
  retry-backoff-ms: ${LLM_RETRY_BACKOFF_MS:2000}

  openrouter:
    base-url: https://openrouter.ai/api/v1
    site-url: ${OPENROUTER_SITE_URL:http://localhost:3000}
    app-name: ${OPENROUTER_APP_NAME:Style Communicator}

app:
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
  daily-session-cap: 10
  style-cache-ttl-minutes: 60
  similarity-threshold: 0.85
  # Generate a strong random string for production (e.g. openssl rand -base64 48)
  jwt-secret: ${JWT_SECRET:change-me-in-production-min-32-chars!!}
  # 24 hours in ms
  jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # Set to true on production (HTTPS). false for local HTTP dev.
  cookie-secure: ${COOKIE_SECURE:false}
