# Activate: SPRING_PROFILES_ACTIVE=openrouter
# One API key (OpenRouter) — use Google/Gemini/DeepSeek/etc. by model id only.
llm:
  provider: openrouter
  api-key: ${OPENROUTER_API_KEY}
  fast-model: google/gemini-2.0-flash-001
  quality-model: google/gemini-2.0-flash-001
  fallback-models:
    - google/gemini-2.0-flash-001
    - openai/gpt-4o-mini
